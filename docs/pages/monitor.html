<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Monitor — Invoice Pro</title>
    <meta name="description" content="সব ইনভয়েস পর্যবেক্ষণ করুন — Invoice Pro Admin">
    <link rel="stylesheet" href="../css/pages.css">
    <link rel="stylesheet" href="../css/monitor.css">
    <script type="importmap">
    {
        "imports": {
            "firebase/app":       "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
        }
    }
    </script>
</head>
<body>
<div id="pageApp">

    <!-- ====== TOPBAR ====== -->
    <header id="pageTopbar"></header>

    <!-- ====== CONTENT ====== -->
    <main id="pageContent">

        <!-- Stats Row -->
        <div class="stats-grid mb-24" id="monitorStatsRow">
            <div class="stat-card blue">
                <div class="stat-card-top">
                    <div>
                        <div class="stat-label">মোট ইনভয়েস</div>
                        <div class="stat-value" id="statTotalInv"><div class="skeleton skel-value"></div></div>
                    </div>
                    <div class="stat-icon">🧾</div>
                </div>
            </div>
            <div class="stat-card green">
                <div class="stat-card-top">
                    <div>
                        <div class="stat-label">মোট বিক্রয়</div>
                        <div class="stat-value" id="statTotalSales"><div class="skeleton skel-value"></div></div>
                    </div>
                    <div class="stat-icon">💰</div>
                </div>
            </div>
            <div class="stat-card orange">
                <div class="stat-card-top">
                    <div>
                        <div class="stat-label">মোট বাকি</div>
                        <div class="stat-value" id="statTotalDue"><div class="skeleton skel-value"></div></div>
                    </div>
                    <div class="stat-icon">⚠️</div>
                </div>
            </div>
            <div class="stat-card purple">
                <div class="stat-card-top">
                    <div>
                        <div class="stat-label">পেন্ডিং রিকোয়েস্ট</div>
                        <div class="stat-value" id="statPendingReqs"><div class="skeleton skel-value"></div></div>
                    </div>
                    <div class="stat-icon">🔔</div>
                </div>
            </div>
        </div>

        <!-- ====== PENDING DELETE REQUESTS SECTION ====== -->
        <div class="card mb-24" id="pendingReqCard" style="display:none;">
            <div class="card-header">
                <div class="card-title">🔔 পেন্ডিং ডিলেট রিকোয়েস্ট <span class="badge badge-orange" id="pendingBadge">0</span></div>
                <button class="btn btn-sm" id="refreshPendingBtn">🔄 রিফ্রেশ</button>
            </div>
            <div class="card-body no-pad" id="pendingReqBody">
                <div class="loading-center"><div class="spinner"></div><span>লোড হচ্ছে...</span></div>
            </div>
        </div>

        <!-- ====== INVOICE TABLE SECTION ====== -->
        <div class="card">
            <div class="card-header">
                <div class="card-title">📋 সব ইনভয়েস</div>
                <div class="section-actions" style="flex-wrap:wrap;gap:8px;">
                    <!-- Search -->
                    <div class="search-bar">
                        <input type="text" id="monitorSearch" placeholder="MPO, কাস্টমার, ইনভয়েস নং...">
                    </div>
                    <!-- Filter by MPO -->
                    <select class="filter-select" id="mpoFilter">
                        <option value="">সব MPO</option>
                    </select>
                    <!-- Filter by status -->
                    <select class="filter-select" id="statusFilter">
                        <option value="unprinted">নতুন (প্রিন্ট হয়নি)</option>
                        <option value="all">সব স্ট্যাটাস</option>
                        <option value="printed">প্রিন্ট করা হয়েছে</option>
                        <option value="active">সক্রিয়</option>
                        <option value="pending">পেন্ডিং</option>
                    </select>
                    <button class="btn btn-sm" id="monitorRefreshBtn">🔄 রিফ্রেশ</button>
                </div>
            </div>

            <div class="card-body no-pad">
                <div class="table-wrap">
                    <table class="data-table" id="monitorTable">
                        <thead>
                            <tr>
                                <th>MPO</th>
                                <th>তারিখ</th>
                                <th>ইনভয়েস নং</th>
                                <th>কাস্টমার</th>
                                <th>পরিমাণ</th>
                                <th>স্ট্যাটাস</th>
                                <th>অ্যাকশন</th>
                            </tr>
                        </thead>
                        <tbody id="monitorTableBody">
                            <tr>
                                <td colspan="7">
                                    <div class="loading-center"><div class="spinner"></div><span>লোড হচ্ছে...</span></div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <!-- Load More -->
                <div id="monitorLoadMoreWrap" style="text-align:center;padding:16px;display:none;">
                    <button class="btn btn-primary" id="monitorLoadMoreBtn">আরও দেখুন</button>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- ====== INVOICE DETAIL MODAL ====== -->
<div class="modal-overlay hidden" id="invoiceDetailModal">
    <div class="modal-box wide">
        <div class="modal-header">
            <div class="modal-title">🧾 ইনভয়েস বিবরণ</div>
            <button class="modal-close" id="closeInvDetail">✕</button>
        </div>
        <div class="modal-body" id="invoiceDetailBody">
            <!-- Rendered dynamically -->
        </div>
        <div class="modal-footer">
            <button class="btn btn-primary" id="printFromDetailBtn">🖨️ Print করুন</button>
            <button class="btn btn-danger" id="deleteFromDetailBtn">🗑️ ডিলেট করুন</button>
        </div>
    </div>
</div>

<script type="module" src="../js/monitor.js"></script>
</body>
</html>
