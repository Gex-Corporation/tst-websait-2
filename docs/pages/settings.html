<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সেটিংস — Invoice Pro</title>
    <link rel="stylesheet" href="../css/pages.css">
    <script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}</script>
</head>
<body>
<div id="pageApp">
    <header id="pageTopbar"></header>
    <main id="pageContent" style="max-width:800px;">

        <div class="section-title mb-24" style="font-size:18px;">⚙️ অ্যাপ সেটিংস</div>

        <!-- Shop Info -->
        <div class="card mb-24">
            <div class="card-header"><div class="card-title">🏢 কোম্পানি তথ্য</div></div>
            <div class="card-body">
                <div class="form-group">
                    <label class="form-label">কোম্পানির নাম / ঠিকানা</label>
                    <textarea class="form-input" id="settingCompanyDetails" rows="4" placeholder="কোম্পানির নাম, ঠিকানা, ফোন, ইমেইল..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">ডিফল্ট নোট (ইনভয়েসের নিচে)</label>
                    <textarea class="form-input" id="settingDefaultNote" rows="2" placeholder="ধন্যবাদ, আবার আসবেন..."></textarea>
                </div>
                <div class="form-group">
                    <label class="form-label">পেমেন্ট নাম্বার ও নির্দেশিকা (ইউজারদের জন্য)</label>
                    <textarea class="form-input" id="settingPaymentInfo" rows="3" placeholder="বিকাশ/নগদ নাম্বার এবং পেমেন্ট করার নির্দেশিকা..."></textarea>
                </div>
                <button class="btn btn-primary" id="saveShopInfoBtn">✅ সেভ ডিফল্ট</button>
            </div>
        </div>

        <!-- Password -->
        <div class="card mb-24">
            <div class="card-header"><div class="card-title">🔒 এডমিন পাসওয়ার্ড পরিবর্তন</div></div>
            <div class="card-body">
                <div class="form-group">
                    <label class="form-label">বর্তমান পাসওয়ার্ড</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" class="form-input" id="currentPassword" placeholder="বর্তমান পাসওয়ার্ড" style="padding-right: 40px; width: 100%;">
                        <span id="togglePasswordVisibility" style="position: absolute; right: 10px; cursor: pointer; font-size: 18px;" title="পাসওয়ার্ড দেখুন">👁️</span>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">নতুন পাসওয়ার্ড</label>
                    <input type="password" class="form-input" id="newPassword" placeholder="নতুন পাসওয়ার্ড">
                </div>
                <div class="form-group">
                    <label class="form-label">নতুন পাসওয়ার্ড নিশ্চিত করুন</label>
                    <input type="password" class="form-input" id="confirmPassword" placeholder="আবার দিন">
                </div>
                <button class="btn btn-danger" id="changePasswordBtn">🔒 পাসওয়ার্ড পরিবর্তন করুন</button>
            </div>
        </div>

        <!-- App Info -->
        <div class="card">
            <div class="card-header"><div class="card-title">ℹ️ অ্যাপ তথ্য</div></div>
            <div class="card-body">
                <div class="info-row"><span class="label">অ্যাপ নাম</span><span class="value">Invoice Pro</span></div>
                <div class="info-row"><span class="label">ভার্সন</span><span class="value">v3.0 (Modular)</span></div>
                <div class="info-row"><span class="label">নির্মাতা</span><span class="value">GEX Corporation | &lt;Dev Alif/&gt;</span></div>
                <div class="info-row"><span class="label">Firebase</span><span class="value">Firestore v10.7.1</span></div>
                <div class="info-row"><span class="label">বর্তমান ব্যবহারকারী</span><span class="value" id="settingCurrentUser">—</span></div>
            </div>
        </div>

    </main>
</div>

<script type="module" src="../js/settings.js"></script>
</body>
</html>
