<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্টক ব্যবস্থাপনা — Invoice Pro</title>
    <link rel="stylesheet" href="../css/pages.css">
    <script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"}}</script>
</head>
<body>
<div id="pageApp">
    <header id="pageTopbar"></header>
    <main id="pageContent">

        <!-- Stats -->
        <div class="stats-grid mb-24">
            <div class="stat-card blue"><div class="stat-card-top"><div><div class="stat-label">মোট পণ্য</div><div class="stat-value" id="statTotalProd">—</div></div><div class="stat-icon">🛍️</div></div></div>
            <div class="stat-card red"><div class="stat-card-top"><div><div class="stat-label">স্টক শেষ</div><div class="stat-value" id="statOutStock">—</div></div><div class="stat-icon">❌</div></div></div>
            <div class="stat-card orange"><div class="stat-card-top"><div><div class="stat-label">কম স্টক (≤10)</div><div class="stat-value" id="statLowStock">—</div></div><div class="stat-icon">⚠️</div></div></div>
            <div class="stat-card green"><div class="stat-card-top"><div><div class="stat-label">পর্যাপ্ত স্টক</div><div class="stat-value" id="statGoodStock">—</div></div><div class="stat-icon">✅</div></div></div>
        </div>

        <div class="section-header">
            <div class="section-title">📦 স্টক তালিকা</div>
            <div class="section-actions" style="flex-wrap:wrap;">
                <div class="search-bar"><input type="text" id="stockSearch" placeholder="পণ্যের নাম খুঁজুন..."></div>
                <select class="filter-select" id="stockFilter">
                    <option value="">সব স্টক</option>
                    <option value="out">স্টক শেষ</option>
                    <option value="low">কম স্টক</option>
                    <option value="ok">পর্যাপ্ত</option>
                </select>
                <button class="btn" id="stockRefreshBtn">🔄 রিফ্রেশ</button>
            </div>
        </div>

        <div class="card">
            <div class="card-body no-pad">
                <div class="table-wrap">
                    <table class="data-table" id="stockTable">
                        <thead><tr>
                            <th>#</th><th>পণ্যের নাম</th><th>মূল্য</th>
                            <th>স্টক পরিমাণ</th><th>স্ট্যাটাস</th><th>অ্যাকশন</th>
                        </tr></thead>
                        <tbody id="stockTableBody">
                            <tr><td colspan="6"><div class="loading-center"><div class="spinner"></div><span>লোড হচ্ছে...</span></div></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>

<!-- Stock Update Modal -->
<div class="modal-overlay hidden" id="stockModal">
    <div class="modal-box narrow">
        <div class="modal-header">
            <div class="modal-title" id="stockModalTitle">📦 স্টক আপডেট</div>
            <button class="modal-close" id="closeStockModal">✕</button>
        </div>
        <div class="modal-body">
            <div style="margin-bottom:14px;padding:12px;background:rgba(255,255,255,0.04);border-radius:9px;border:1px solid var(--border);">
                <div class="font-bold mb-16" id="stockModalProductName"></div>
                <div class="info-row"><span class="label">বর্তমান স্টক</span><span class="value" id="stockModalCurrentQty" style="font-size:18px;font-weight:700"></span></div>
            </div>
            <div class="form-group">
                <label class="form-label">পরিবর্তন করুন</label>
                <div style="display:flex;gap:8px;margin-bottom:10px;">
                    <button class="btn flex-1" id="stockInBtn" style="border-color:rgba(16,185,129,0.4);color:var(--green2)">+ স্টক IN</button>
                    <button class="btn flex-1" id="stockOutBtn" style="border-color:rgba(239,68,68,0.4);color:var(--red2)">− স্টক OUT</button>
                    <button class="btn flex-1" id="stockSetBtn">= সেট করুন</button>
                </div>
                <input type="number" class="form-input" id="stockChangeInput" placeholder="পরিমাণ" min="0">
                <div style="margin-top:10px;font-size:13px;color:var(--text-muted)">নতুন স্টক হবে: <span id="stockPreview" style="color:var(--text-primary);font-weight:700">—</span></div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn" id="cancelStockModal">বাতিল</button>
            <button class="btn btn-primary" id="saveStockBtn">✅ সেভ করুন</button>
        </div>
    </div>
</div>

<script type="module" src="../js/stock.js"></script>
</body>
</html>
